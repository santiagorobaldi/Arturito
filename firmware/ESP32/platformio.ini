
[platformio]
default_envs = esp32_clock_test
src_dir = ..

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DBOARD_ESP32
    -Isrc
    -Isrc/config
    -I../shared/layer1_hal
    -I../shared/layer2_drivers
    -I../shared/layer3_app

lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    adafruit/Adafruit MPU6050 @ ^2.2.9
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15

[env:esp32_rover]
extends = env:base

build_src_filter =
    +<ESP32/src/entry_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_i2c_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_time_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_telemetry_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_mpu6050_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_vl53l0x_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_telemetry_network_esp32.cpp>
    +<shared/layer2_drivers/*.c>
    +<shared/layer3_app/*.c>
    +<shared/layer3_app/localization/*.c>
    +<shared/layer3_app/sensing/*.c>

[env:esp32_clock_test]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -I../shared/test/hal_time

build_src_filter =
    +<ESP32/src/entry_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_time_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_telemetry_esp32.cpp>
    +<shared/test/hal_time/*.c>
