[platformio]
default_envs = esp32dev

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DBOARD_ESP32
    -Isrc
    -Isrc/config
    -I../shared/config
    -I../shared/layer1_hal
    -I../shared/layer2_drivers
    -I../shared/layer3_app

lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    adafruit/Adafruit MPU6050 @ ^2.2.9
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15

; Base para la proxima aplicacion o ensayo; aun no hay setup/loop.
[env:esp32dev]
extends = env:base
build_src_filter =
    +<layer1_hal/*.cpp>
    +<../../shared/layer2_drivers/*.c>
    +<../../shared/layer3_app/*.c>
