[platformio]
default_envs = esp32dev

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DBOARD_ESP32
    -Isrc
    -Isrc/config
    -I../shared/config
    -I../shared/layer1_hal
    -I../shared/layer2_drivers
    -I../shared/layer3_app
    -I../shared/libs/VL53L0X_1.0.4/Api/core/inc
    -I../shared/libs/VL53L0X_1.0.4/Api/platform/inc
    -I../EDU-CIAA/libs/as5600/source

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.9
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15

; Base para la proxima aplicacion o ensayo; aun no hay setup/loop.
[env:esp32dev]
extends = env:base
build_src_filter =
    +<layer1_hal/*.cpp>
    -<layer1_hal/hal_vl53l0x_esp32.cpp>
    +<../../shared/layer2_drivers/*.c>
    +<../../shared/layer3_app/*.c>
    +<../../shared/libs/VL53L0X_1.0.4/Api/core/src/*.c>
    +<../../shared/libs/VL53L0X_1.0.4/Api/platform/src/vl53l0x_platform.c>
    +<../../shared/libs/VL53L0X_1.0.4/Api/platform/src/vl53l0x_i2c_platform.c>
    +<../../EDU-CIAA/libs/as5600/source/driver_as5600.c>
