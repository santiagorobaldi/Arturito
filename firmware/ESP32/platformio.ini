[platformio]
default_envs = esp32_clock_test
src_dir = ..

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    -DBOARD_ESP32
    -Isrc
    -Isrc/config
    -I../shared/layer1_hal
    -I../shared/layer2_drivers
    -I../shared/layer3_app
    -I../shared/libs/VL53L0X_1.0.4/Api/core/inc
    -I../shared/libs/VL53L0X_1.0.4/Api/platform/inc
    -I../shared/libs/as5600/source

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.9
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15

[env:esp32_rover]
extends = env:base

build_src_filter =
    +<ESP32/src/entry_esp32.cpp>
    +<ESP32/src/layer1_hal/*.cpp>
    +<shared/layer2_drivers/driver_mpu6050.c>
    +<shared/layer2_drivers/driver_vl53l0x.c>
    +<shared/layer2_drivers/driver_encoder.c>
    +<shared/layer3_app/main.c>
    +<shared/layer3_app/localization/*.c>
    +<shared/layer3_app/sensing/*.c>
    +<shared/libs/VL53L0X_1.0.4/Api/core/src/*.c>
    +<shared/libs/VL53L0X_1.0.4/Api/platform/src/vl53l0x_platform.c>
    +<shared/libs/VL53L0X_1.0.4/Api/platform/src/vl53l0x_i2c_platform.c>
    +<shared/libs/as5600/source/driver_as5600.c>

[env:esp32_clock_test]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -I../shared/test/hal_time

build_src_filter =
    +<ESP32/src/entry_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_time_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_telemetry_esp32.cpp>
    +<shared/test/hal_time/*.c>

[env:esp32_tof_test]
extends = env:base
build_flags =
    ${env:base.build_flags}
    -I../shared/test/tof

build_src_filter =
    +<ESP32/src/entry_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_i2c_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_time_esp32.cpp>
    +<ESP32/src/layer1_hal/hal_telemetry_esp32.cpp>
    +<shared/layer2_drivers/driver_vl53l0x.c>
    +<shared/test/tof/*.c>
    +<shared/libs/VL53L0X_1.0.4/Api/core/src/*.c>
    +<shared/libs/VL53L0X_1.0.4/Api/platform/src/vl53l0x_platform.c>
    +<shared/libs/VL53L0X_1.0.4/Api/platform/src/vl53l0x_i2c_platform.c>
