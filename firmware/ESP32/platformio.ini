[platformio]
default_envs = perception_v0

[env:base]
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -DBOARD_ESP32
    -Isrc
    -I../shared/layer1_hal
    -I../shared/layer2_drivers
    -I../shared/layer3_app
    -I../shared/tests/perception_v0

[env:perception_v0]
extends = env:base
monitor_speed = 115200
build_src_filter =
    +<tests/perception_v0.cpp>
    +<layer1_hal/hal_mpu6050_esp32.cpp>
    +<layer1_hal/hal_vl53l0x_esp32.cpp>
    +<layer1_hal/hal_time_esp32.cpp>
    +<layer1_hal/hal_telemetry_esp32.cpp>
    +<../../shared/layer2_drivers/driver_mpu6050.c>
    +<../../shared/layer2_drivers/driver_vl53l0x.c>
    +<../../shared/tests/perception_v0/perception_v0.c>

lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15

; Compatibilidad con el nombre anterior: construye el mismo ensayo V0.
[env:esp32dev]
extends = env:perception_v0

[env:imu_only]
extends = env:base
monitor_speed = 115200
build_src_filter =
    +<layer1_hal/hal_mpu6050_esp32.cpp>
    +<layer1_hal/hal_time_esp32.cpp>
    +<tests/imu_only.cpp>
    +<../../shared/layer2_drivers/driver_mpu6050.c>

lib_deps =
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15

[env:vl53l0x_only]
extends = env:base
build_src_filter =
    +<layer1_hal/hal_vl53l0x_esp32.cpp>
    +<tests/vl53l0x_only.cpp>
    +<../../shared/layer2_drivers/driver_vl53l0x.c>

lib_deps =
    adafruit/Adafruit_VL53L0X @ ^1.2.4

[env:wifi_tcp_only]
extends = env:base
monitor_speed = 115200
build_src_filter =
    +<tests/wifi_tcp_only.cpp>
    +<layer1_hal/hal_telemetry_network_esp32.cpp>

[env:perception_v0_wifi]
extends = env:perception_v0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env:perception_v0.build_flags}
    -DPERCEPTION_V0_WIFI_TCP
build_src_filter =
    ${env:perception_v0.build_src_filter}
    +<layer1_hal/hal_telemetry_network_esp32.cpp>
